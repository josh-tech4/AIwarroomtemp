name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.4.10
      - run: ruff check backend/
      - run: ruff format --check backend/

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aiwarroom_test
          POSTGRES_USER: aiwarroom
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
        working-directory: backend/
      - name: Run migrations check
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production
          POSTGRES_DB: aiwarroom_test
          POSTGRES_USER: aiwarroom
          POSTGRES_PASSWORD: testpassword
          POSTGRES_HOST: localhost
          DJANGO_SETTINGS_MODULE: config.settings.test
          AI_PROVIDER: mock
          GEMINI_API_KEY: ""
        run: python manage.py makemigrations --check --dry-run
        working-directory: backend/
      - name: Run pytest
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production
          POSTGRES_DB: aiwarroom_test
          POSTGRES_USER: aiwarroom
          POSTGRES_PASSWORD: testpassword
          POSTGRES_HOST: localhost
          DJANGO_SETTINGS_MODULE: config.settings.test
          AI_PROVIDER: mock
          GEMINI_API_KEY: ""
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing -v
        working-directory: backend/

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend/
      - run: npm run type-check
        working-directory: frontend/
      - run: npm run lint
        working-directory: frontend/
      - run: npm test -- --run
        working-directory: frontend/

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ai-warroom-backend:ci
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ai-warroom-frontend:ci
